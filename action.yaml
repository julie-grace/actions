name: 'Build Container Image'
description: 'Build and Push to Registry'
inputs:
  # registry config
  registry_name:
    description: 'Container registry'
    default: 'ghcr.io'
    required: true
  registry_username:
    description: 'Username for container registry'
    required: true
  registry_password:
    description: 'Password for container registry'
    required: true
  push:
    description: 'Push container image to registry ?'
    required: false
    default: 'true'
  # end
  # docker config
  context:
    description: 'Docker build context'
    required: true
    default: '.'
  dockerfile:
    description: 'Dockerfile name'
    required: true
    default: 'Dockerfile'
  image_name:
    description: 'Name of image to working with'
    required: true
  image_tag:
    description: 'Tag of image to working with. Default: latest'
    required: true
    default: 'latest'
  target:
    description: 'Multistage docker target'
    required: false
    default: ''
  cache_ref_suffix:
    description: >-
      Suffix for the registry build cache ref, e.g. `prod` gives
      <image_name>:buildcache-prod. Give each Dockerfile its own suffix so
      builds of different Dockerfiles do not overwrite each other's cache.
      Default: empty, which keeps the shared <image_name>:buildcache ref.
    required: false
    default: ''
  # end
  # composer config
  composer_github_auth:
    description: 'Github token to enable composer to install private packages'
    required: false
  # end
  # env config
  copy_env:
    description: 'Copy .env.example to .env'
    required: false
    default: 'true'
  # end
  # build args
  build-args:
    description: 'Additional docker build arguments (KEY=VALUE per line)'
    required: false
    default: ''
  # end
runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - run: npm install
      shell: sh
    - name: install Tabler - Manually
      shell: sh
      run: npm install @tabler/core@1.0.0-beta9
    - name: Install Webpack - Manually
      shell: sh
      run: npm install webpack@5.88.2 --save-dev
    - name: build static assets
      shell: sh
      run: |
        if [ "${{ inputs.copy_env }}" = "true" ]; then
          cp .env.example .env
        fi
        npm run prod
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{inputs.registry_name}}
        username: ${{inputs.registry_username}}
        password: ${{inputs.registry_password}}
    - name: Build and push
      id: docker_build
      uses: docker/build-push-action@v6
      with:
        context: ${{inputs.context}}
        push: ${{inputs.push}}
        tags: ${{inputs.image_name}}:${{inputs.image_tag}}
        file: ${{inputs.dockerfile}}
        build-args: |
          GITHUB_TOKEN=${{inputs.composer_github_auth}}
          COMPOSER_GITHUB_TOKEN=${{inputs.composer_github_auth}}
          ${{inputs.build-args}}
        cache-from: type=registry,ref=${{inputs.image_name}}:buildcache${{ inputs.cache_ref_suffix != '' && format('-{0}', inputs.cache_ref_suffix) || '' }}
        cache-to: type=registry,mode=max,ref=${{inputs.image_name}}:buildcache${{ inputs.cache_ref_suffix != '' && format('-{0}', inputs.cache_ref_suffix) || '' }}
        target: ${{inputs.target}}
